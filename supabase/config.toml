project_id = "pawsup"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Token validation occurs inside the handler, supporting current signing keys.
[functions.health]
verify_jwt = false

[functions.pet-assistant]
verify_jwt = false

[functions.travel]
verify_jwt = false
